# Live backend on free Neon Postgres + Render

services:
  - type: web
    name: gst-expense-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENV
        value: production
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-flash-latest
      - key: STORAGE_PATH
        value: /var/data/uploads
      - key: CORS_ORIGINS
        value: "*"
      - key: OTP_DEV_FIXED
        value: "123456"
    disk:
      name: uploads
      mountPath: /var/data
      sizeGB: 1
